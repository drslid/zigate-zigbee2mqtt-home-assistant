# Exemple pour l’application Zigbee2MQTT avec Mosquitto sur Home Assistant OS.
# Fusionner ces sections avec le fichier de configuration de Zigbee2MQTT.
homeassistant:
  enabled: true

mqtt:
  server: mqtt://core-mosquitto:1883
  base_topic: zigbee2mqtt
  user: zigbee2mqtt
  password: "REMPLACER_PAR_LE_MOT_DE_PASSE_MQTT"

serial:
  adapter: zigate
  port: tcp://192.168.1.50:9999
