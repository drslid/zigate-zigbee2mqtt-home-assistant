global
    chroot /var/lib/haproxy
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 5s
    timeout client 24h
    timeout server 24h

frontend home_assistant
    bind 0.0.0.0:8099
    tcp-request connection reject unless { src 172.30.32.2 127.0.0.1 }
    default_backend zigbee2mqtt

backend zigbee2mqtt
    server frontend 127.0.0.1:8100
